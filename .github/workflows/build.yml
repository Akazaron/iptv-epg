name: Build EPG

on:
  schedule:
    # 04:20 UTC daily - after the upstream sources have refreshed overnight
    - cron: "20 4 * * *"
  workflow_dispatch:        # lets you trigger a rebuild by hand
  push:
    paths:
      - "mapping.json"
      - "build.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate mapping.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          with open("mapping.json", encoding="utf-8-sig") as fh:
              mapping = json.load(fh)
          # A value must be an id an upstream source publishes, never another
          # provider key. build.py fans out from source ids and does NOT resolve
          # chains, so a chained entry silently emits no channel at all.
          chains = {k: v for k, v in mapping.items() if v in mapping and mapping[v] != v}
          for k, v in sorted(chains.items()):
              print(f"::error::chained mapping: {k} -> {v}, but {v} -> {mapping[v]}")
          if chains:
              sys.exit(f"{len(chains)} chained entries - point them straight at the source id")
          print(f"mapping.json OK: {len(mapping)} entries, no chains")
          PY

      - name: Build the guide
        run: python build.py

      - name: Sanity-check the output
        run: |
          set -euo pipefail
          test -s epg.xml.gz
          size=$(stat -c%s epg.xml.gz)
          echo "epg.xml.gz is ${size} bytes"
          # a healthy build is several MB; anything tiny means a source died
          if [ "${size}" -lt 1000000 ]; then
            echo "::error::epg.xml.gz is suspiciously small (${size} bytes) - refusing to publish"
            exit 1
          fi
          # must be valid gzip and valid XML
          gzip -t epg.xml.gz
          python - <<'PY'
          import gzip, xml.etree.ElementTree as ET
          with gzip.open("epg.xml.gz") as fh:
              root = ET.parse(fh).getroot()
          ch = len(root.findall("channel"))
          pr = len(root.findall("programme"))
          print(f"parsed OK: {ch} channels, {pr} programmes")
          assert ch > 100 and pr > 10000, "guide looks empty - not publishing"
          PY

      - name: Check every mapping entry produced a guide
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, sys, xml.etree.ElementTree as ET
          from collections import Counter
          with open("mapping.json", encoding="utf-8-sig") as fh:
              mapping = json.load(fh)
          with gzip.open("epg.xml.gz") as fh:
              root = ET.parse(fh).getroot()
          progs = Counter(p.get("channel") for p in root.findall("programme"))
          # A key with no programmes means its target carries nothing upstream -
          # renamed, retired, or a typo. Refuse to publish a mapping that lies.
          dead = sorted(k for k in mapping if not progs.get(k))
          for k in dead:
              print(f"::error::dead mapping: {k} -> {mapping[k]} produced no programmes")
          if dead:
              sys.exit(f"{len(dead)} of {len(mapping)} mapping entries produced no guide")
          print(f"all {len(mapping)} mapping entries carry a guide")
          PY

      - name: Publish to the epg branch
        run: |
          set -euo pipefail
          # --global is required: the publish step runs `git init` in a fresh
          # directory, which does not inherit the checked-out repo's config.
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Orphan branch, force-pushed each run: the repo never accumulates
          # a multi-megabyte binary in its history.
          rm -rf .publish && mkdir .publish
          cp epg.xml.gz .publish/
          date -u +"built %Y-%m-%d %H:%M UTC" > .publish/LAST_BUILD.txt
          cd .publish
          git init -q
          git checkout -q --orphan epg
          git add epg.xml.gz LAST_BUILD.txt
          git commit -q -m "EPG $(date -u +%Y-%m-%d)"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            epg
          echo "published"
